<script>
const APP = 'https://script.google.com/macros/s/AKfycbzolbATMtd3yiYGoOjy54uAIBOzF1WxuftPXmJ_J55_qOp9FpKq9sErzyV5eEWxirRuPQ/exec';
let u = '';
try { u = localStorage.getItem('dm_user') || ''; } catch (e) { }
const SRC = APP + (u ? '?u=' + encodeURIComponent(u) : '');
document.getElementById('go').href = SRC;
const fr = document.getElementById('app');
fr.addEventListener('load', function () { setTimeout(function () { fr.classList.add('on'); }, 600); });
fr.src = SRC;
window.addEventListener('message', function (e) {
  if (!/\.googleusercontent\.com$|^https:\/\/script\.google\.com$/.test(e.origin)) return;
  const d = e.data || {};
  if (d.type !== 'dm-user') return;
  try { if (d.user) localStorage.setItem('dm_user', String(d.user).slice(0, 60)); else localStorage.removeItem('dm_user'); } catch (x) { }
